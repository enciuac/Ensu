<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Biblioteca · EnSu</title>
<link rel="icon" href="img/logo.png" type="image/png">
<link rel="apple-touch-icon" href="img/logo.png">
<link rel="apple-touch-icon" sizes="180x180" href="img/logo.png">
<!-- La biblioteca ahora vive dentro de index.html. Esta página redirige para no romper enlaces antiguos. -->
<meta http-equiv="refresh" content="0; url=index.html#/biblioteca">
<script>
(function(){
  var id=new URLSearchParams(location.search).get("leer");
  location.replace("index.html#/"+(id?"leer/"+encodeURIComponent(id):"biblioteca"));
})();
</script>
<style>body{font-family:system-ui,sans-serif;background:#F7F4EF;color:#1A1714;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0}a{color:#9C7F4C}</style>
</head>
<body>
<p>Abriendo la <a href="index.html#/biblioteca">biblioteca</a>…</p>
<script>
document.addEventListener("contextmenu",e=>e.preventDefault());
document.addEventListener("keydown",function(e){
  if(e.key==="F12"){e.preventDefault();return false;}
  if(e.ctrlKey&&e.shiftKey&&["I","J","C","K"].includes(e.key.toUpperCase())){e.preventDefault();return false;}
  if(e.ctrlKey&&e.key.toUpperCase()==="U"){e.preventDefault();return false;}
  if(e.metaKey&&e.altKey&&e.key.toUpperCase()==="I"){e.preventDefault();return false;}
});
</script>
</body>
</html>
